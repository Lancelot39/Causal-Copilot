[tool.pytest.ini_options]
addopts = "-m 'not integration and not llm and not latex'"
testpaths = [
    "test_latex_functionality.py",
    "causal_discovery/tests",
    "tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
norecursedirs = [
    "externals",
    "asset",
    "data",
    ".git",
    ".venv",
]
markers = [
    "integration: tests that require external services or optional system dependencies",
    "latex: tests that require LaTeX tooling and optional document packages",
    "llm: tests that call LLM providers or local model servers",
]

[tool.ruff]
target-version = "py310"
extend-exclude = [
    "externals",
    "asset",
    "data/dataset",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
